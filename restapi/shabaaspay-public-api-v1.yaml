          description: PayID status returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessPayIdStatusResponse'
        '404':
          description: PayID not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token returned by `/api/public/authorization`.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Merchant API key in `Authorization` header.

  schemas:
    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Success
        data:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      required: [message, error_code, data]
      properties:
        message:
          type: string
          example: Payee account cannot receive NPP Payments
        error_code:
          type: string
          example: MOV_NPP_PAYMENT_NOT_SUPPORTED
        data:
          type: object
          additionalProperties: true
          example:
            response_time: "2026-04-08T12:28:26.759Z"

    SuccessAuthorizationResponse:
      type: object
      properties:
        message:
          type: string
          example: Success
        data:
          type: object
          properties:
            token:
              type: string
              example: Bearer eyJhbGciOiJIUzI1NiJ9...

    PaymentAgreement:
      type: object
      description: Payment agreement object returned by create/get agreement APIs.
      properties:
        payment_agreement_id:
          type: string
          description: Unique agreement identifier. Use this value to retrieve, amend, resend, or cancel the agreement.
          example: "3652PA20260428120000123"
        status:
          type: string
          description: Current agreement state in the processing lifecycle.
          example: initiated
        end_date:
          type: string
          format: date
          description: Agreement end date when set; null/omitted when open-ended.
          example: "2026-12-31"
        created_at:
          type: string
          format: date-time
          description: Agreement creation timestamp in ISO8601 format.
          example: "2026-04-28T12:00:00.000Z"
        maximum_amount:
          type: string
          description: Maximum debit amount allowed per agreement.
          example: "500.00"
        extented_status:
          type: string
          description: Compact composite status string used by existing clients.
          example: "500-WEEK-10-initiated"
        message:
          type: string
          description: Present when agreement has a failure message from scheme
          example: Payee account cannot receive NPP Payments
        failure_code:
          type: string
          description: Provider/business failure code when the agreement fails.
          example: M100

    SuccessPaymentAgreementResponse:
      type: object
      description: Standard success envelope for payment agreement APIs.
      properties:
        message:
          type: string
          description: Message for the request response.
          example: Payment Agreement created successfully, Please authorized payment agreement from your banking app.
        data:
          $ref: '#/components/schemas/PaymentAgreement'

    CreatePaymentAgreementRequest:
      type: object
      description: Request payload used to create a recurring payment agreement for a payer.
      required:
        - name
        - type
        - maximum_amount
        - frequency
        - number_of_transactions_permitted
        - pay_id
      properties:
        phone_number:
          type: string
          description: Optional payer phone number. When provided, the payer profile is looked up/created against this number.
          example: "+61422020901"
        name:
          type: string
          minLength: 2
          maxLength: 140
          description: Payer display name used in agreement records and authorization flow.
          example: John Smith
        type:
          type: string
          description: Identifier type for payer/payee details.
          example: email
          enum: [email, phone, bsb]
        maximum_amount:
          type: string
          description: Maximum debit amount allowed per transaction under this agreement.
          example: "500.00"
        frequency:
          type: string
          description: |
            Stored codes (after normalization): ADHO, DAIL, FRTN, INDA, MIAN, MNTH, QURT, WEEK, YEAR.
            Aliases before save: DAILY→DAIL, ADHOC→ADHO.
          example: ADHO
          enum: [ADHO, DAIL, FRTN, INDA, MIAN, MNTH, QURT, WEEK, YEAR, DAILY, ADHOC]
        number_of_transactions_permitted:
          type: integer
          minimum: 1
          maximum: 1000
          description: Maximum number of debits permitted under this agreement.
          example: 10
        pay_id:
          type: string
          description: PayID used for payer authorization (for example email PayID or mobile PayID).
          example: sample@shabaas.com
        bsb:
          oneOf:
            - type: string
            - type: integer
          description: BSB value when bank-account based setup is used.
          example: "123456"
        account_number:
          oneOf:
            - type: string
            - type: integer
          description: Account number when bank-account based setup is used.
          example: "987654321"
        agreement_type:
          type: string
          description: Agreement variation/type code used by downstream provider where applicable.
          example: VARI
        start_date:
          type: string
          format: date
          description: Optional agreement start date in `YYYY-MM-DD`.
          example: "2026-05-01"
        end_date:
          type: string
          format: date
          description: Optional agreement end date in `YYYY-MM-DD`. Leave empty for open-ended agreement.
          example: "2026-12-31"

    ResendPaymentAgreementRequest:
      type: object
      description: Provide either agreement `id` or `phone_number`.
      oneOf:
        - required: [id]
        - required: [phone_number]
      properties:
        id:
          type: string
        phone_number:
          type: string

    BilateralAmendPaymentAgreementRequest:
      type: object
      required:
        - id
        - maximum_amount
        - frequency
        - number_of_transactions_permitted
        - agreement_type
      properties:
        id:
          type: string
        maximum_amount:
          type: string
        frequency:
          type: string
        number_of_transactions_permitted:
          oneOf:
            - type: string
            - type: integer
        agreement_type:
          type: string

    CreateOneTimePaymentAgreementRequest:
      type: object
      description: Request payload used to create a one-time payment agreement flow.
      required: [name, amount, type, pay_id]
      properties:
        phone_number:
          type: string
          description: Optional payer mobile number used to look up or create a payer profile.
          example: "+61422020901"
        email:
          type: string
          format: email
          description: Optional payer email for communication and agreement context.
          example: payer@example.com
        name:
          type: string
          minLength: 2
          maxLength: 140
          description: Payer display name shown in agreement flow.
          example: John Smith
        amount:
          oneOf:
            - type: string
            - type: number
          description: One-time debit amount for this agreement flow.
          example: "100.00"
        notes:
          type: string
          maxLength: 140
          description: Optional short note/description attached to the one-time flow.
          example: Invoice 1042
        bsb:
          oneOf:
            - type: string
            - type: integer
          description: Optional BSB when account-based payer details are used.
          example: "123456"
        account_number:
          oneOf:
            - type: string
            - type: integer
          description: Optional account number when account-based payer details are used.
          example: "987654321"
        type:
          type: string
          description: Identifier type hint for payer details.
          enum: [email, phone, bsb]
          default: email
          example: email
        pay_id:
          type: string
          description: Required PayID value for payer authorization context.
          example: sample@shabaas.com
        frequency:
          type: string
          description: Optional frequency hint when converted into a recurring-compatible structure.
          enum: [ADHO, DAIL, FRTN, INDA, MIAN, MNTH, QURT, WEEK, YEAR, DAILY, ADHOC]
          example: ADHO
        number_of_transactions_permitted:
          oneOf:
            - type: string
            - type: integer
          description: Optional transaction count limit metadata for downstream processing.
          example: 1
        agreement_type:
          type: string
          description: Optional agreement type code used by downstream provider.
          example: VARI
        start_date:
          type: string
          format: date
          description: Optional agreement start date in `YYYY-MM-DD`.
          example: "2026-05-01"
        end_date:
          type: string
          format: date
          description: Optional agreement end date in `YYYY-MM-DD`.
          example: "2026-05-31"

    GenerateInvoiceRequest:
      type: object
      required: [amount]
      properties:
        amount:
          oneOf:
            - type: string
            - type: number
        description:
          type: string
        bill_to:
          type: string
        address:
          type: string
        receiver_abn:
          type: string
        ref_no:
          type: string
        gst_included:
          type: boolean
        gst_does_not_apply:
          type: boolean
        email:
          type: string
          format: email

    CheckoutUrlRequest:
      type: object
      required: [expiry_date, amount]
      properties:
        expiry_date:
          type: string
          description: Link expiry date as accepted by checkout API (for example `DD-MM-YYYY`).
          example: "12-11-2026"
        amount:
          oneOf:
            - type: string
            - type: number
          description: Checkout amount.
          example: "60"
        notes:
          type: string
          description: Optional checkout notes.
          example: Invoice #1042

    BusinessPayLinkRequest:
      type: object
      required: [pay_id]
      properties:
        pay_id:
          type: string
          description: Requested business PayID alias (must not contain `@`).
          example: buss.fees

    BusinessPayLinkResponse:
      type: object
      properties:
        message:
          type: string
          example: Business Payid created successfully
        data:
          type: object
          properties:
            business_payid:
              type: string
              example: buss.fees@sbpay.au
            business_payid_name:
              type: string
              example: buss.fees
            status:
              type: string
              example: Enabled

    ExternalCheckoutRequest:
      type: object
      required: [amount, checkout]
      properties:
        amount:
          oneOf:
            - type: string
            - type: number
          description: External checkout amount.
          example: "50"
        notes:
          type: string
          description: Optional checkout notes.
          example: testing
        checkout:
          type: object
          description: External checkout parameter object.
          additionalProperties: true
          example:
            first_and_last_name: Jon Doe
            company_name: Test Corp
            business_abn: "111111111"
            email: customer@example.com
            phone_number: "6141012233"

    CheckoutLinkResponse:
      type: object
      properties:
        message:
          type: string
          example: Success
        data:
          type: object
          properties:
            checkout_url:
              type: string
              example: https://checkout.shabaas.com/au/staging-demo-merchant?token=eyJhbGci...

    DestinationAccount:
      type: object
      description: Destination payout account details used when instant payout is enabled.
      properties:
        bsb:
          type: string
          minLength: 6
          maxLength: 6
          description: Destination BSB (6 digits).
          example: "123456"
        account_number:
          type: string
          minLength: 4
          maxLength: 12
          description: Destination account number.
          example: "12345678"

    PaymentInitiation:
      type: object
      description: Payment initiation object returned by create/get initiation APIs.
      properties:
        payment_initiation_id:
          type: string
          description: Unique payment initiation identifier.
          example: "12345PI1714316400"
        payment_agreement_id:
          type: string
          description: Linked payment agreement identifier.
          example: "3652PA20260428120000123"
        amount:
          oneOf:
            - type: string
            - type: number
          description: Debit amount for this initiation.
          example: "10.00"
        status:
          type: string
          description: Current initiation processing status.
          example: accp
        created_at:
          type: string
          format: date-time
          description: Initiation creation timestamp in ISO8601 format.
          example: "2026-04-28T13:45:00.000Z"
        settled:
          type: boolean
          description: Indicates whether the initiation has settled.
          example: false
        transfer:
          type: string
          description: Transfer state/classification when available.
          nullable: true
          example: null
        failure_code:
          type: string
          description: Provider/business failure code.
          example: R803
        message:
          type: string
          description: Failure or status message supplied by processing system.
          example: Similar payment attempted within last 24 hours

    SuccessPaymentInitiationResponse:
      type: object
      description: Standard success envelope for payment initiation APIs.
      properties:
        message:
          type: string
          description: Human-readable outcome message.
          example: Success
        data:
          $ref: '#/components/schemas/PaymentInitiation'

    CreatePaymentInitiationRequest:
      type: object
      description: Request payload used to initiate a payment against an active agreement.
      required: [payment_agreement_id, amount]
      properties:
        payment_agreement_id:
          type: string
          description: Existing active payment agreement identifier.
          example: "3652PA20260428120000123"
        amount:
          oneOf:
            - type: number
            - type: string
          description: Debit amount to initiate for this request.
          example: "10.00"
        notes:
          type: string
          maxLength: 140
          description: Optional note attached to the initiation.
          example: Invoice 1042
        description:
          type: string
          description: Ignored by the API; use `notes` for optional text.
          example: (ignored)

    DirectDebitInitiationRequest:
      type: object
      description: Request payload used to create and initiate direct debit flow.
      required: [name, phone_number, bsb, amount, consent_received]
      properties:
        id:
          type: string
          description: Optional internal reference id.
          example: "DD-REF-1001"
        phone_number:
          type: string
          description: Payer mobile number.
          example: "+61422020901"
        name:
          type: string
          minLength: 2
          maxLength: 140
          description: Payer account holder name.
          example: John Smith
        token:
          type: string
          description: Optional token passed from prior payer flow.
          example: tok_abc123
        maximum_amount:
          oneOf:
            - type: string
            - type: number
          description: Optional max amount metadata for agreement creation stage.
          example: "100.00"
        type:
          type: string
          description: Payer identifier/account type hint.
          enum: [bsb, email, phone]
          example: bsb
        bsb:
          type: string
          minLength: 6
          maxLength: 6
          description: Payer BSB.
          example: "123456"
        account_number:
          type: string
          minLength: 4
          maxLength: 12
          description: Payer account number.
          example: "987654321"
        pay_id:
          type: string
          description: Optional payer PayID.
          example: sample@shabaas.com
        checkout_page:
          type: string
          description: Optional checkout page marker/reference.
          example: direct_debit
        notes:
          type: string
          maxLength: 140
          description: Optional note attached to the debit initiation.
          example: Membership debit
        amount:
          oneOf:
            - type: string
            - type: number
          description: Debit amount requested.
          example: "50.00"
        consent_received:
          type: string
          enum: ["true"]
          description: Must be the string value `"true"`.

    WebhookUpsertRequest:
      type: object
      description: Request payload to create or update merchant webhook endpoints.
      required:
        - auth_key
        - payment_agreement
        - payment_initiation
        - direct_debit_accepted
        - direct_debit_rejected
      properties:
        auth_key:
          type: string
          description: Shared secret value sent with webhook requests for receiver-side verification.
          minLength: 8
          maxLength: 200
          example: whsec_7f9d2b84c1f2
        payment_agreement:
          type: string
          format: uri
          description: HTTPS endpoint that receives payment agreement status callbacks.
          example: https://staging.abc.co/payment_agreement
        payment_initiation:
          type: string
          format: uri
          description: HTTPS endpoint that receives payment initiation callbacks.
          example: https://staging.abc.co/payment_initiation
        direct_debit_accepted:
          type: string
          format: uri
          description: HTTPS endpoint invoked when direct debit is accepted.
          example: https://staging.abc.co/direct_debit_accepted
        direct_debit_rejected:
          type: string
          format: uri
          description: HTTPS endpoint invoked when direct debit is rejected/dishonoured.
          example: https://staging.abc.co/direct_debit_rejected

    WebhookConfig:
      type: object
      description: Stored webhook endpoint configuration for the authenticated merchant.
      properties:
        payment_agreement:
          type: string
          format: uri
          description: Configured payment agreement callback endpoint.
          example: https://staging.abc.co/payment_agreement
        payment_initiation:
          type: string
          format: uri
          description: Configured payment initiation callback endpoint.
          example: https://staging.abc.co/payment_initiation
        direct_debit_accepted:
          type: string
          format: uri
          description: Configured direct debit accepted callback endpoint.
          example: https://staging.abc.co/direct_debit_accepted
        direct_debit_rejected:
          type: string
          format: uri
          description: Configured direct debit rejected callback endpoint.
          example: https://staging.abc.co/direct_debit_rejected

    CreatePayIdCollectionRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          format: float
        merchant_id:
          type: string
        merchant_display_name:
          type: string
        merchant_country:
          type: string
          example: AU
        merchant_category:
          type: string

    SuccessPayIdCreateResponse:
      type: object
      properties:
        message:
          type: string
          example: Payid created successfully
        data:
          type: object
          properties:
            payid:
              type: string
            amount:
              oneOf:
                - type: number
                - type: string
            status:
              type: string
              example: CREATED
            expires_at:
              type: string
              example: "2026-01-02 08:49:46"

    SuccessPayIdStatusResponse:
      type: object
      properties:
        message:
          type: string
          example: Payid status
        data:
          type: object
          properties:
            status:
              type: string
              example: PENDING
            received_at:
              type: string
              nullable: true
            expected_amount:
              type: number
            received_amount:
              type: number

    ErrorModel:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      description: Compatibility alias for the standard error envelope.

    PaymentRequestObj:
      type: object
      required: [PaymentRequest]
      properties:
        PaymentRequest:
          $ref: '#/components/schemas/CreatePayIdCollectionRequest'
      description: Compatibility wrapper for payment request payloads.

    PaymentRequestStatusObj:
      allOf:
        - $ref: '#/components/schemas/SuccessPayIdStatusResponse'
      description: Compatibility wrapper for payment request status payloads.

    PaymentAgreementObj:
      type: object
      required: [PaymentAgreement]
      properties:
        PaymentAgreement:
          $ref: '#/components/schemas/CreatePaymentAgreementRequest'
      description: Compatibility wrapper for payment agreement payloads.

    PaymentAgreementStatusObj:
      allOf:
        - $ref: '#/components/schemas/SuccessPaymentAgreementResponse'
      description: Compatibility wrapper for payment agreement status payloads.

    PaymentInitiationObj:
      type: object
      required: [PaymentInitiation]
      properties:
        PaymentInitiation:
          $ref: '#/components/schemas/CreatePaymentInitiationRequest'
      description: Compatibility wrapper for payment initiation payloads.

    PaymentInitiationStatusObj:
      allOf:
        - $ref: '#/components/schemas/SuccessPaymentInitiationResponse'
      description: Compatibility wrapper for payment initiation status payloads.
