openapi: 3.0.3
info:
  title: ShaBaasPay Public API
  version: 1.0.0
  description: |
    Describes public REST endpoints for authorization, payment agreements, payment initiations,
    webhooks, invoice generation, and PayID collection APIs.
servers:
  - url: https://dev-api.shabaas.com
    description: Staging
  - url: https://api.shabaas.com
    description: Production
tags:
  - name: API Keys
    x-displayName: API Keys
    description: Authentication and key-based access controls for API usage.
  - name: Payment Agreement
    x-displayName: Payment Agreement
    description: Create, retrieve, amend, resend, and cancel PayTo payment agreements.
  - name: Payment Initiation
    x-displayName: Payment Initiation
    description: Create and retrieve payment initiations linked to active agreements.
  - name: Payment Agreement Request
    x-displayName: Payment Agreement Request
    description: Generate payer approval flows for agreement setup where applicable.
  - name: Payment Request
    x-displayName: Payment Request
    description: Create inbound payment requests and query their status.
  - name: Webhooks
    x-displayName: Webhooks
    description: Configure notification endpoints for agreement and payment events.
  - name: Authentication
    x-displayName: Authentication
    description: Generate and manage bearer-token access for public API calls.
  - name: Clients
    x-displayName: Clients
    description: Merchant-level access and account configuration endpoints.
x-tagGroups:
  - name: SHABAASPAY PUBLIC API
    tags:
      - API Keys
      - Payment Agreement
      - Payment Initiation
      - Payment Agreement Request
      - Payment Request
      - Webhooks
  - name: Internal
    tags:
      - Authentication
      - Clients
security:
  - BearerAuth: []
paths:
  /api/public/authorization:
    post:
      tags: [Authentication, API Keys]
      summary: Generate Bearer Token
      description: |
        Obtain a bearer token for subsequent authenticated PayTo requests. Tokens are valid for 24 hours.
        Send the merchant API key in `Authorization` (raw key or `Bearer <key>`).

        ### Error Codes
        | Code | Status | Reason | What to do |
        | ---- | ------ | ------ | ---------- |
        | AUTH_001 | 401 | Invalid API key | Verify the API key and retry with the correct credential. |
        | AUTH_002 | 401 | Merchant account is not active | Activate the merchant account before requesting a token. |
        | AUTH_003 | 408 | Upstream timeout | Retry with backoff; if persistent, contact support with request timestamp. |
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessAuthorizationResponse'
        '401':
          description: Invalid API key or merchant not allowed to authenticate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_api_key:
                  summary: Unknown or wrong API key
                  value:
                    message: Invalid API Key
                    error_code: GN-0000
                    data:
                      response_time: "2026-04-10T12:00:00.000Z"
                account_not_active:
                  summary: Merchant exists but is not active
                  value:
                    message: Account not activated yet
                    error_code: GN-0000
                    data:
                      response_time: "2026-04-10T12:00:00.000Z"
        '408':
          description: Upstream timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/public/payment_agreement:
    get:
      tags: [Payment Agreement]
      summary: Get payment agreement
      description: |
        Retrieve a payment agreement by `id` (payment_agreement_id).

        ### Error Codes
        | Code | Status | Reason | What to do |
        | ---- | ------ | ------ | ---------- |
        | PAM_PAGID_REQUIRED | 400 | `payment_agreement_id` is missing | Provide a valid agreement id in query params. |
        | PAM_PAGID_INVALID | 400 | Agreement id format is invalid | Correct the id format and retry. |
        | PAM_SB_PAG_NOT_FOUND_ERROR | 404 | Payment agreement not found for this merchant | Confirm the `id` and ensure it belongs to the authenticated merchant. |
        | PAM_FORBIDDEN_ERROR | 403 | Merchant is not allowed to access this agreement | Verify merchant/account permissions. |
        | PAM_MAPPING_ERROR | 500 | Internal mapping error while resolving agreement | Retry later; contact support if repeated. |
        | PAM_NPP_GATEWAY_TIMEOUT | 408 | Upstream timeout | Retry with backoff; if still failing, contact support. |
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
          description: payment_agreement_id
      responses:
        '200':
          description: Payment agreement details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessPaymentAgreementResponse'
              examples:
                found:
                  summary: Agreement found
                  value:
                    message: Success
                    data:
                      payment_agreement_id: "3652PA20260428120000123"
                      status: active
                      end_date: "2026-12-31"
                      created_at: "2026-04-28T12:00:00.000Z"
                      maximum_amount: "500.00"
                      extented_status: "500-WEEK-10-active"
        '401':
          description: Invalid or missing bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Authorization failed
                  value:
                    message: Unauthorized Access to an operation
                    error_code: GN-0000
                    data:
                      response_time: "2026-04-28T12:00:00.000Z"
        '404':
          description: Agreement id not found for this merchant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    message: MONOOVA-monoova.PAM_SB_PAG_NOT_FOUND_ERROR
                    error_code: GN-0000
                    data:
                      response_time: "2026-04-10T12:00:00.000Z"
        '408':
          description: Upstream timeout while fetching agreement status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                timeout:
                  summary: Upstream timeout
                  value:
                    message: Request Timeout
                    error_code: GN-0000
                    data:
                      response_time: "2026-04-28T12:00:00.000Z"
    post:
      tags: [Payment Agreement]
      summary: Create payment agreement
      description: |
        Create a PayTo payment agreement.

        ### Error Codes
        | Code | Status | Reason | What to do |
        | ---- | ------ | ------ | ---------- |
        | PAM_REQ_BODY_INVALID | 400 | Malformed request body | Validate JSON payload structure and field types. |
        | PAM_REQUEST_EMPTY | 400 | Request payload is empty | Send `payment_agreement` object with required fields. |
        | PAM_VALIDATION_ERROR | 400 | Request validation failed | Correct invalid/missing fields and retry. |
        | PAM_PAYEE_MISSING | 400 | Payee details are missing | Provide PayID or valid account details. |
        | PAM_PAYEE_ACCT_MISSING | 400 | Payee account details are missing | Include both BSB and account number when required. |
        | PAM_PAYEE_BSB_INVALID | 400 | Payee BSB is invalid | Use a valid 6-digit BSB. |
        | PAM_PAYEE_ACCT_INVALID | 400 | Payee account number is invalid | Provide a valid account number. |
        | PAM_PMT_FREQ_INVALID | 400 | Frequency value is invalid | Use one of supported frequency values. |
        | PAM_PAG_LIMIT_EXCEEDED | 400 | Merchant agreement limit exceeded | Reduce request volume or increase limit. |
        | M101 | 422 | Amount exceeds platform single-agreement threshold | Reduce `maximum_amount` to supported threshold. |
        | M100 | 422 | Amount exceeds merchant agreement limit | Update merchant limits or lower `maximum_amount`. |
        | MOV_NPP_PAYMENT_NOT_SUPPORTED | 422 | Payee account cannot receive NPP payments | Use a valid PayID/account that can receive NPP payments. |
        | MOV_PAYEE_DETAIL_ERROR | 404 | Payee details are incorrect | Correct PayID/BSB/account details. |
        | MOV_INVALID_BSB | 400 | BSB is invalid | Provide a valid BSB and retry. |
        | MOV_REQUEST_TIMEOUT | 408 | Provider request timed out | Retry with backoff and poll status if needed. |
        | VALIDATION_ERROR | 422 | Invalid request fields (for example frequency) | Correct payload format and accepted enum values. |
        | CREDITS_EXHAUSTED | 402 | Developer credits exhausted | Top up developer credits and retry. |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_agreement]
              properties:
                payment_agreement:
                  $ref: '#/components/schemas/CreatePaymentAgreementRequest'
            examples:
              valid:
                summary: Valid request (stored frequency code)
                value:
                  payment_agreement:
                    name: John Smith
                    type: email
                    maximum_amount: "500"
                    frequency: ADHO
                    number_of_transactions_permitted: 10
                    pay_id: sample@shabaas.com
              frequency_alias:
                summary: Alias normalized by API (DAILY→DAIL, ADHOC→ADHO)
                value:
                  payment_agreement:
                    name: John Smith
                    type: email
                    maximum_amount: "500"
                    frequency: DAILY
                    number_of_transactions_permitted: 10
                    pay_id: sample@shabaas.com
              invalid_frequency:
                summary: Invalid frequency (e.g. DAY is not a valid code or alias)
                value:
                  payment_agreement:
                    name: Hamza Amin
                    type: email
                    maximum_amount: "500"
                    frequency: DAY
                    number_of_transactions_permitted: 10
                    pay_id: sample@shabaas.com
      responses:
        '200':
          description: Payment agreement created and submitted for payer authorization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessPaymentAgreementResponse'
              examples:
                created:
                  summary: Agreement created successfully
                  value:
                    message: Payment Agreement created successfully, Please authorized payment agreement from your banking app.
                    data:
                      payment_agreement_id: "3652PA20260428120000123"
                      status: initiated
                      end_date: "2026-12-31"
                      created_at: "2026-04-28T12:00:00.000Z"
                      maximum_amount: "500.00"
                      extented_status: "500-WEEK-10-initiated"
        '401':
          description: Invalid or missing authorization context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Authorization failed
                  value:
                    message: Unauthorized Access to an operation
                    error_code: GN-0000
                    data:
                      response_time: "2026-04-28T12:00:00.000Z"
        '402':
          description: Developer credits exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                developer_credits:
                  value:
                    message: Developer credits exhausted
                    error_code: GN-0000
                    data:
                      response_time: "2026-04-10T12:00:00.000Z"
        '404':
          description: Related resource not found in current merchant context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                agreement_context_not_found:
                  summary: Referenced entity not found
                  value:
                    message: MONOOVA-monoova.PAM_SB_PAG_NOT_FOUND_ERROR
                    error_code: GN-0000
                    data:
                      response_time: "2026-04-28T12:00:00.000Z"
        '408':
          description: Upstream provider timeout while processing agreement creation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                timeout:
                  summary: Upstream timeout
                  value:
                    message: Request Timeout
                    error_code: GN-0000
                    data:
                      response_time: "2026-04-28T12:00:00.000Z"
        '422':
          description: Validation or business-rule failure for agreement creation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_frequency:
                  summary: Frequency not accepted after normalization
                  value:
                    message: Invalid frequency value
                    error_code: VALIDATION_ERROR
                    data:
                      field: frequency
                      stored_codes: [ADHO, DAIL, FRTN, INDA, MIAN, MNTH, QURT, WEEK, YEAR]
                      aliases: { DAILY: DAIL, ADHOC: ADHO }
                monoova_payee:
                  summary: Payee cannot receive NPP (example)
                  value:
                    message: Payee account cannot receive NPP Payments
                    error_code: MOV_NPP_PAYMENT_NOT_SUPPORTED
                    data:
                      response_time: "2026-04-08T12:28:26.759Z"

  /api/public/payment_agreement/resend:
    patch:
      tags: [Payment Agreement]
      summary: Resend payment agreement authorization request
      description: |
        Re-issue an agreement authorization request using agreement id or phone number.

        ### Error Codes
        | Code | Status | Reason | What to do |
        | ---- | ------ | ------ | ---------- |
        | PAM_REQ_BODY_INVALID | 400 | Malformed resend payload | Send `payment_agreement.id` or `payment_agreement.phone_number`. |
        | PAM_REQUEST_EMPTY | 400 | Request payload is empty | Include resend lookup payload and retry. |
        | USER_NOT_FOUND | 404 | User not found by provided phone number | Verify `phone_number` and retry. |
        | PAM_SB_PAG_NOT_FOUND_ERROR | 404 | Payment agreement not found | Verify the agreement id belongs to the merchant. |
        | RESEND_MAX_REACHED | 422 | Maximum resend attempts reached | Wait for reset window before retrying resend. |
        | PAM_UNEXPECTED_ERROR | 500 | Unexpected resend processing error | Retry later and contact support if repeated. |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_agreement]
              properties:
                payment_agreement:
                  $ref: '#/components/schemas/ResendPaymentAgreementRequest'
            examples:
              by_id:
                value:
                  payment_agreement:
                    id: "3652PA20260408123221550"
              by_phone_number:
                value:
                  payment_agreement:
                    phone_number: "+61-422020901"
      responses:
        '200':
          description: Agreement resend request submitted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessPaymentAgreementResponse'
              examples:
                resent:
                  summary: Resend request accepted
                  value:
                    message: Payment Agreement resent successfully, Please authorized payment agreement from your banking app.
                    data:
                      payment_agreement_id: "3652PA20260428124500999"
                      status: initiated
                      end_date: "2026-12-31"
                      created_at: "2026-04-28T12:45:00.000Z"
                      maximum_amount: "500.00"
                      extented_status: "500-WEEK-10-initiated"
        '404':
          description: User agreement id not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                user_not_found:
                  value:
                    message: User not found
                    error_code: GN-0000
                    data:
                      response_time: "2026-04-10T12:00:00.000Z"
                agreement_not_found:
                  value:
                    message: PaymentAgreement not found for PaymentAgreementUID
                    error_code: PAM_SB_PAG_NOT_FOUND_ERROR
                    data:
                      response_time: "2026-04-10T12:00:00.000Z"
        '422':
          description: Resend blocked by business validation rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                resend_limit:
                  value:
                    message: Maximum resend attempts reached
                    error_code: RESEND_MAX_REACHED
                    data:
                      response_time: "2026-04-10T12:00:00.000Z"

  /api/public/payment_agreement/bilateral:
    patch:
      tags: [Payment Agreement]
      summary: Bilateral amend payment agreement
      description: |
        Submit bilateral amendment details for an existing payment agreement.

        ### Error Codes
        | Code | Status | Reason | What to do |
        | ---- | ------ | ------ | ---------- |
        | PAM_REQ_BODY_INVALID | 400 | Malformed amend payload | Validate JSON body and required amend fields. |
        | PAM_AMEND_FORBIDDEN | 400 | Agreement status does not allow amend | Amend only active/paused eligible agreements. |
        | PAM_AMEND_PENDING | 400 | Pending bilateral amend already exists | Wait for current amend to complete before retrying. |
        | PAM_ACTION_INVALID | 400 | Invalid amend action/state transition | Correct status/action inputs and retry. |
        | PAM_SB_PAG_NOT_FOUND_ERROR | 404 | Payment agreement not found | Verify the target agreement id or phone mapping. |
        | M101 | 422 | Requested amount exceeds hard threshold | Lower `maximum_amount` to an allowed value. |
        | M100 | 422 | Requested amount exceeds merchant limit | Increase merchant limit or lower the requested amount. |
        | MOV_AMEND_STATUS_VALIDATION_FAILED | 400 | Amendment status validation failed | Ensure amend request fields are valid for current status. |
        | MOV_MULTIPLE_FIELD_CHANGE_ERROR | 400 | Unsupported multiple-field amend with response time | Amend fewer fields per request and retry. |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_agreement]
              properties:
                payment_agreement:
                  $ref: '#/components/schemas/BilateralAmendPaymentAgreementRequest'
            examples:
              default:
                value:
                  payment_agreement:
                    id: "3652PA20260408123221550"
                    maximum_amount: "500"
                    frequency: WEEK
                    number_of_transactions_permitted: "10"
                    agreement_type: VARI
      responses:
        '200':
          description: Bilateral amendment submitted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                amended:
                  summary: Amendment request accepted
                  value:
                    message: Payment agreement updated. Please authorise the changes using your banking app.
                    data: {}
        '404':
          description: Target payment agreement not found for merchant context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: Agreement id not found
                  value:
                    message: MONOOVA-monoova.PAM_SB_PAG_NOT_FOUND_ERROR
                    error_code: GN-0000
                    data:
                      response_time: "2026-04-28T12:00:00.000Z"
        '422':
          description: Validation or business-rule error while applying amendment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                amount_rule:
                  value:
                    message: Amount exceeds merchant limit
                    error_code: M100
                    data:
                      response_time: "2026-04-10T12:00:00.000Z"

  /api/public/payment_agreement/cancel:
    delete:
      tags: [Payment Agreement]
      summary: Cancel payment agreement
      description: |
        Cancel an existing payment agreement by id.

        ### Error Codes
        | Code | Status | Reason | What to do |
        | ---- | ------ | ------ | ---------- |
        | PAM_PAGID_REQUIRED | 400 | Agreement id is required | Provide `id` query parameter and retry. |
        | PAM_PAGID_INVALID | 400 | Agreement id format is invalid | Correct agreement id format. |
        | PAM_INVALID_OPERATION | 400 | Current agreement state cannot be cancelled | Ensure agreement is in cancellable state. |
        | PAM_SB_PAG_NOT_FOUND_ERROR | 404 | Payment agreement not found | Check `id` and ensure it belongs to this merchant. |
        | PAM_FORBIDDEN_ERROR | 403 | Merchant is not allowed to cancel this agreement | Verify merchant ownership/permissions. |
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment agreement cancelled successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                cancelled:
                  summary: Agreement cancelled
                  value:
                    message: Payment Agreement cancelled successfully
                    data: {}
        '404':
          description: Agreement id not found for this merchant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: Agreement id not found
                  value:
                    message: MONOOVA-monoova.PAM_SB_PAG_NOT_FOUND_ERROR
                    error_code: GN-0000
                    data:
                      response_time: "2026-04-28T12:00:00.000Z"

  /api/public/payment_agreement/one_time:
    post:
      tags: [Payment Agreement Request, Payment Agreement]
      summary: Create one-time payment agreement
      description: |
        Create a one-time payment agreement flow linked to checkout.

        ### Error Codes
        | Code | Status | Reason | What to do |
        | ---- | ------ | ------ | ---------- |
        | PAM_REQ_BODY_INVALID | 400 | Malformed one-time agreement payload | Validate body structure and field formats. |
        | PAM_REQUEST_EMPTY | 400 | Request payload is empty | Provide `payment_agreement` object with required fields. |
        | PAM_PAYEE_MISSING | 400 | Payee details missing | Provide PayID or account-based details. |
        | PAM_PAYEE_ID_INVALID | 400 | PayID format/type is invalid | Correct PayID value/type and retry. |
        | VALIDATION_ERROR | 422 | Invalid one-time agreement payload | Validate required fields and formats before retrying. |
        | PAM_NPP_GATEWAY_ERROR | 422 | Upstream processing error | Retry request; if repeated, contact support with request details. |
        | PAM_NPP_GATEWAY_TIMEOUT | 408 | Upstream timeout | Retry with backoff and poll status. |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_agreement]
              properties:
                payment_agreement:
                  $ref: '#/components/schemas/CreateOneTimePaymentAgreementRequest'
                destination:
                  $ref: '#/components/schemas/DestinationAccount'
      responses:
        '200':
          description: One-time payment agreement created and submitted for payer authorization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessPaymentAgreementResponse'
              examples:
                created:
                  summary: One-time agreement created
                  value:
                    message: Payment Agreement created successfully, Please authorized payment agreement from your banking app.
                    data:
                      payment_agreement_id: "3652PA20260428131500011"
                      status: initiated
                      end_date: null
                      created_at: "2026-04-28T13:15:00.000Z"
                      maximum_amount: "100.00"
                      extented_status: "100-ADHO-1-initiated"
        '422':
          description: Validation or business-rule error while creating one-time agreement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_error:
                  summary: Invalid payload
                  value:
                    message: Invalid request payload
                    error_code: VALIDATION_ERROR
                    data:
                      response_time: "2026-04-28T13:15:00.000Z"
                provider_error:
                  summary: Upstream provider error
                  value:
                    message: MONOOVA-monoova.PAM_NPP_GATEWAY_ERROR
                    error_code: GN-0000
                    data:
                      response_time: "2026-04-28T13:15:00.000Z"

  /api/public/generate_invoice:
    post:
      tags: [Payment Request]
      summary: Generate invoice checkout URL
      description: |
        Generate a checkout URL for invoice collection flow.

        ### Error Codes
        | Code | Status | Reason | What to do |
        | ---- | ------ | ------ | ---------- |
        | UNAUTHORIZED_OPERATION | 401 | Merchant identifier is invalid or unauthorized | Verify `uuid` and merchant access. |
        | PA_INVALID_AMOUNT | 422 | Invoice amount exceeds allowed threshold | Reduce invoice amount and retry. |
        | VALIDATION_ERROR | 422 | Invalid invoice payload | Correct request body fields and retry. |
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uuid, invoice]
              properties:
                uuid:
                  type: string
                  description: Merchant checkout username or merchant secret.
                phone_number:
                  type: string
                invoice:
                  $ref: '#/components/schemas/GenerateInvoiceRequest'
            examples:
              basic_invoice:
                summary: Minimal valid payload
                value:
                  uuid: merchant-checkout-username
                  invoice:
                    amount: "100.00"
                    description: Monthly subscription
              full_invoice:
                summary: Full payload with optional fields
                value:
                  uuid: merchant-checkout-username
                  phone_number: "+61422020901"
                  invoice:
                    amount: "249.95"
                    description: Invoice INV-2026-001
                    bill_to: John Citizen
                    address: "10 George St, Sydney NSW 2000"
                    receiver_abn: "12000000000"
                    ref_no: INV-2026-001
                    gst_included: false
                    gst_does_not_apply: false
                    email: john@example.com
      responses:
        '200':
          description: Invoice checkout URL generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success
                  data:
                    type: object
                    properties:
                      checkout_url:
                        type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/public/payment_initiation:
    get:
      tags: [Payment Initiation]
      summary: Get payment initiation
      description: |
        Retrieve a payment initiation by `id` (payment_initiation_id).

        ### Error Codes
        | Code | Status | Reason | What to do |
        | ---- | ------ | ------ | ---------- |
        | PAS_PMTID_REQUIRED | 400 | `payment_initiation_id` is missing | Provide `id` query parameter and retry. |
        | PAS_PMT_UID_INVALID | 400 | Initiation id format is invalid | Correct initiation id format and retry. |
        | PAYMENT_INITIATION_NOT_FOUND | 404 | Payment initiation not found | Verify the `id` belongs to this merchant and retry. |
        | PAS_INSTRUCTION_NOT_FOUND | 404 | Payment instruction record not found | Verify initiation id and processing state. |
        | PAS_PAM_TIMEOUT_ERROR | 500 | Timeout while calling agreement service | Retry later and contact support if persistent. |
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
          description: payment_initiation_id
      responses:
        '200':
          description: Payment initiation details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessPaymentInitiationResponse'
              examples:
                found:
                  summary: Payment initiation found
                  value:
                    message: Success
                    data:
                      payment_initiation_id: "12345PI1714316400"
                      settled: false
                      status: inpr
                      transfer: null
                      created_at: "2026-04-28T13:30:00.000Z"
        '401':
          description: Invalid or missing bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Authorization failed
                  value:
                    message: Unauthorized Access to an operation
                    error_code: GN-0000
                    data:
                      response_time: "2026-04-28T13:30:00.000Z"
        '404':
          description: Payment initiation id not found for this merchant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    message: Payment Initiation not found
                    error_code: GN-0000
                    data:
                      response_time: "2026-04-10T12:00:00.000Z"
        '408':
          description: Upstream timeout while retrieving payment initiation details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                timeout:
                  summary: Upstream timeout
                  value:
                    message: Request Timeout
                    error_code: GN-0000
                    data:
                      response_time: "2026-04-28T13:30:00.000Z"
    post:
      tags: [Payment Initiation]
      summary: Initiate payment
      description: |
        Initiate a payment against an active payment agreement.

        ### Error Codes
        | Code | Status | Reason | What to do |
        | ---- | ------ | ------ | ---------- |
        | PAS_REQ_BODY_INVALID | 400 | Malformed request body | Validate JSON payload and required fields. |
        | PAS_REQUEST_EMPTY | 400 | Request payload is empty | Provide `payment_initiation` payload and retry. |
        | PAS_PAGID_REQUIRED | 400 | `payment_agreement_id` is required | Include a valid agreement id. |
        | PAS_AMT_REQUIRED | 400 | `amount` is required | Provide amount in the request payload. |
        | PAS_AMT_INVALID | 400 | Amount format is invalid | Provide a numeric amount with valid precision. |
        | PAM_SB_PAG_NOT_FOUND_ERROR | 404 | Payment agreement not found | Verify `payment_agreement_id` and merchant ownership. |
        | PAS_AGREEMENT_STATUS_INACTIVE | 422 | Agreement is not active | Activate agreement before initiating payment. |
        | PAS_AGREEMENT_ENDED | 400 | Agreement end date has passed | Use a valid active agreement. |
        | PAS_AGREEMENT_NOT_STARTED | 400 | Agreement start date is in future | Retry after agreement start date. |
        | PAS_PAYMENT_TOO_SOON | 400 | Execution window/cooldown not met | Wait and retry after the cooldown window. |
        | PAS_MAX_AMT_EXCEEDED | 400 | Amount exceeds agreement max amount | Lower amount or amend agreement limits. |
        | R804 | 422 | Duplicate/too-soon payment initiation detected | Wait for cooldown window and retry once eligible. |
        | R101 | 422 | Amount exceeds per-transaction/agreement limit | Reduce `amount` to allowed limit. |
        | R102 | 422 | Daily spend limit exceeded | Retry next cycle or reduce amount. |
        | R100 | 422 | Daily transaction count limit exceeded | Retry next day or after account review. |
        | R103 | 422 | Destination payout not allowed for merchant settings | Enable eligible payout settings or remove destination. |
        | R803 | 422 | Upstream initiation failed | Retry; if persistent, contact support with request metadata. |
        | PAS_NPP_GATEWAY_ERROR | 502 | Provider gateway returned an error | Retry with backoff; contact support if repeated. |
        | PAS_NPP_GATEWAY_TIMEOUT | 504 | Provider gateway timeout | Retry request and check status afterwards. |
        | R805 | 200 | Upstream timeout with accepted processing state | Poll status using get endpoint until terminal state. |
        | CREDITS_EXHAUSTED | 402 | Developer credits exhausted | Top up developer credits and retry. |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_initiation]
              properties:
                payment_initiation:
                  $ref: '#/components/schemas/CreatePaymentInitiationRequest'
            examples:
              minimal:
                value:
                  payment_initiation:
                    payment_agreement_id: "3652PA20260408123221550"
                    amount: "10.00"
              with_notes:
                summary: With optional note
                value:
                  payment_initiation:
                    payment_agreement_id: "3652PA20260408123221550"
                    amount: 10
                    notes: Invoice 1042
      responses:
        '200':
          description: Payment initiation created successfully (or accepted for processing).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessPaymentInitiationResponse'
              examples:
                created:
                  summary: Initiation accepted
                  value:
                    message: Success
                    data:
                      payment_initiation_id: "12345PI1714316400"
                      settled: false
                      status: accp
                      transfer: null
                      created_at: "2026-04-28T13:45:00.000Z"
                timeout_accepted:
                  summary: Accepted with timeout notice
                  value:
                    message: Payment request accepted and processing is pending
                    data:
                      payment_initiation_id: "12345PI1714316400"
                      settled: false
                      status: accp
                      transfer: null
                      created_at: "2026-04-28T13:45:00.000Z"
        '401':
          description: Invalid or missing bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Authorization failed
                  value:
                    message: Unauthorized Access to an operation
                    error_code: GN-0000
                    data:
                      response_time: "2026-04-28T13:45:00.000Z"
        '402':
          description: Developer credit balance is insufficient for this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                developer_credits:
                  value:
                    message: Developer credits exhausted
                    error_code: GN-0000
                    data:
                      response_time: "2026-04-10T12:00:00.000Z"
        '404':
          description: Referenced payment agreement was not found for this merchant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                agreement_missing:
                  value:
                    message: MONOOVA-monoova.PAM_SB_PAG_NOT_FOUND_ERROR
                    error_code: GN-0000
                    data:
                      response_time: "2026-04-10T12:00:00.000Z"
        '408':
          description: Upstream timeout while initiating payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Agreement inactive, limits exceeded, cooldown violation, other business errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                agreement_inactive:
                  summary: Agreement exists but is not active
                  value:
                    message: MONOOVA-monoova.PAS_AGREEMENT_STATUS_INACTIVE
                    error_code: GN-0000
                    data:
                      response_time: "2026-04-10T12:00:00.000Z"
                cooldown:
                  summary: Too soon vs recent initiation (example code)
                  value:
                    message: MONOOVA-monoova.R804
                    error_code: GN-0000
                    data:
                      response_time: "2026-04-10T12:00:00.000Z"
                amount_limit:
                  summary: Amount exceeds agreement or per-tx cap (example)
                  value:
                    message: MONOOVA-monoova.R101
                    error_code: GN-0000
                    data:
                      response_time: "2026-04-10T12:00:00.000Z"
                monoova_failed:
                  summary: Initiation failed at scheme (representative)
                  value:
                    message: MONOOVA-monoova.R803
                    error_code: GN-0000
                    data:
                      response_time: "2026-04-10T12:00:00.000Z"

  /api/public/payment_initiation/direct_debit:
    post:
      tags: [Payment Initiation]
      summary: Initiate direct debit payment
      description: |
        Create direct debit initiation and process settlement workflow.

        ### Error Codes
        | Code | Status | Reason | What to do |
        | ---- | ------ | ------ | ---------- |
        | PAS_REQ_BODY_INVALID | 400 | Malformed direct debit payload | Validate body structure and required fields. |
        | PAS_REQUEST_EMPTY | 400 | Request payload is empty | Provide `direct_debit` payload and retry. |
        | PAS_AMT_REQUIRED | 400 | Amount is required | Include `amount` in direct debit payload. |
        | PAS_AMT_INVALID | 400 | Amount format is invalid | Use a valid numeric amount format. |
        | R104 | 422 | Consent is missing or invalid | Set `consent_received` to `"true"` and retry. |
        | R101 | 422 | Amount exceeds allowed threshold | Reduce `amount` and retry. |
        | R801 | 422 | Similar debit attempted within cooldown period | Wait for cooldown window and retry. |
        | R102 | 422 | Daily spend limit exceeded | Retry later or reduce amount. |
        | R100 | 422 | Daily transaction count exceeded | Retry next day or after account review. |
        | R103 | 422 | Destination payout not enabled | Update merchant payout settings or remove destination. |
        | R803 | 422 | Direct debit initiation failed upstream | Retry; if repeated, contact support with request details. |
        | MOV_INVALID_BANK_ACCOUNT | 400 | Bank account does not belong to current institution | Correct payer account details and retry. |
        | MOV_INVALID_BSB | 400 | Invalid BSB number | Provide valid 6-digit BSB and retry. |
        | MOV_REQUEST_TIMEOUT | 408 | Request timed out | Retry after a short delay. |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direct_debit]
              properties:
                direct_debit:
                  $ref: '#/components/schemas/DirectDebitInitiationRequest'
                destination:
                  $ref: '#/components/schemas/DestinationAccount'
      responses:
        '200':
          description: Direct debit initiation created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessPaymentInitiationResponse'
              examples:
                initiated:
                  summary: Direct debit initiation accepted
                  value:
                    message: Success
                    data:
                      payment_initiation_id: "DD12345PI1714316400"
                      settled: false
                      status: acsc
                      transfer: null
                      created_at: "2026-04-28T14:00:00.000Z"
        '422':
          description: Validation or business-rule error during direct debit initiation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                consent_required:
                  value:
                    message: Consent is required
                    error_code: R104
                    data:
                      response_time: "2026-04-10T12:00:00.000Z"
                cooldown_23h:
                  value:
                    message: Similar payment attempted within last 23 hours
                    error_code: R801
                    data:
                      response_time: "2026-04-10T12:00:00.000Z"

  /api/public/webhooks:
    post:
      tags: [Webhooks]
      summary: Create or update webhook endpoints
      description: |
        Create or update webhook callback endpoints for merchant event notifications.

        ### Error Codes
        | Code | Status | Reason | What to do |
        | ---- | ------ | ------ | ---------- |
        | VALIDATION_ERROR | 422 | Webhook payload is invalid | Ensure all webhook URLs and auth key values are valid. |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookUpsertRequest'
      responses:
        '200':
          description: Webhook saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Invalid webhook payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Webhooks]
      summary: Get webhook endpoints
      description: |
        Retrieve currently configured webhook endpoints for the merchant.

        ### Error Codes
        | Code | Status | Reason | What to do |
        | ---- | ------ | ------ | ---------- |
        | WEBHOOK_NOT_FOUND | 404 | No webhook configuration exists for this merchant | Configure webhooks first using create/update endpoint. |
      responses:
        '200':
          description: Webhook configuration returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success
                  data:
                    $ref: '#/components/schemas/WebhookConfig'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/collections/payid:
    post:
      tags: [Payment Request]
      summary: Create inbound PayID collection
      description: |
        Create a PayID collection request and return a generated PayID reference.

        ### Error Codes
        | Code | Status | Reason | What to do |
        | ---- | ------ | ------ | ---------- |
        | INVALID_AMOUNT | 422 | Amount is invalid or less than/equal to zero | Provide a positive amount and retry. |
        | PAYMENT_METHOD_NOT_FOUND | 404 | Merchant payment method is missing | Configure merchant payment method before creating PayID. |
        | PAYID_ALREADY_EXISTS | 422 | Generated PayID already exists | Retry request to generate a new PayID. |
        | PAYID_CREATE_FAILED | 422 | Upstream PayID creation failed | Retry with valid details or contact support. |
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayIdCollectionRequest'
      responses:
        '200':
          description: PayID created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessPayIdCreateResponse'
        '404':
          description: Payment method not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation or creation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/collections/payid/status:
    get:
      tags: [Payment Request]
      summary: Get inbound PayID status
      description: |
        Retrieve status for a previously created PayID collection.

        ### Error Codes
        | Code | Status | Reason | What to do |
        | ---- | ------ | ------ | ---------- |
        | PAYID_NOT_FOUND | 404 | PayID record not found for this merchant | Verify `payid` and merchant authorization, then retry. |
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: payid
          required: true
          schema:
            type: string
        - in: query
          name: expected_amount
          required: false
          schema:
            type: number
      responses:
        '200':
          description: PayID status returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessPayIdStatusResponse'
        '404':
          description: PayID not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token returned by `/api/public/authorization`.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Merchant API key in `Authorization` header.

  schemas:
    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Success
        data:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      required: [message, error_code, data]
      properties:
        message:
          type: string
          example: Payee account cannot receive NPP Payments
        error_code:
          type: string
          example: MOV_NPP_PAYMENT_NOT_SUPPORTED
        data:
          type: object
          additionalProperties: true
          example:
            response_time: "2026-04-08T12:28:26.759Z"

    SuccessAuthorizationResponse:
      type: object
      properties:
        message:
          type: string
          example: Success
        data:
          type: object
          properties:
            token:
              type: string
              example: Bearer eyJhbGciOiJIUzI1NiJ9...

    PaymentAgreement:
      type: object
      description: Payment agreement object returned by create/get agreement APIs.
      properties:
        payment_agreement_id:
          type: string
          description: Unique agreement identifier. Use this value to retrieve, amend, resend, or cancel the agreement.
          example: "3652PA20260428120000123"
        status:
          type: string
          description: Current agreement state in the processing lifecycle.
          example: initiated
        end_date:
          type: string
          format: date
          description: Agreement end date when set; null/omitted when open-ended.
          example: "2026-12-31"
        created_at:
          type: string
          format: date-time
          description: Agreement creation timestamp in ISO8601 format.
          example: "2026-04-28T12:00:00.000Z"
        maximum_amount:
          type: string
          description: Maximum debit amount allowed per agreement.
          example: "500.00"
        extented_status:
          type: string
          description: Compact composite status string used by existing clients.
          example: "500-WEEK-10-initiated"
        message:
          type: string
          description: Present when agreement has a failure message from scheme
          example: Payee account cannot receive NPP Payments
        failure_code:
          type: string
          description: Provider/business failure code when the agreement fails.
          example: M100

    SuccessPaymentAgreementResponse:
      type: object
      description: Standard success envelope for payment agreement APIs.
      properties:
        message:
          type: string
          description: Message for the request response.
          example: Payment Agreement created successfully, Please authorized payment agreement from your banking app.
        data:
          $ref: '#/components/schemas/PaymentAgreement'

    CreatePaymentAgreementRequest:
      type: object
      description: Request payload used to create a recurring payment agreement for a payer.
      required:
        - name
        - type
        - maximum_amount
        - frequency
        - number_of_transactions_permitted
        - pay_id
      properties:
        phone_number:
          type: string
          description: Optional payer phone number. When provided, the payer profile is looked up/created against this number.
          example: "+61422020901"
        name:
          type: string
          minLength: 2
          maxLength: 140
          description: Payer display name used in agreement records and authorization flow.
          example: John Smith
        type:
          type: string
          description: Identifier type for payer/payee details.
          example: email
          enum: [email, phone, bsb]
        maximum_amount:
          type: string
          description: Maximum debit amount allowed per transaction under this agreement.
          example: "500.00"
        frequency:
          type: string
          description: |
            Stored codes (after normalization): ADHO, DAIL, FRTN, INDA, MIAN, MNTH, QURT, WEEK, YEAR.
            Aliases before save: DAILY→DAIL, ADHOC→ADHO.
          example: ADHO
          enum: [ADHO, DAIL, FRTN, INDA, MIAN, MNTH, QURT, WEEK, YEAR, DAILY, ADHOC]
        number_of_transactions_permitted:
          type: integer
          minimum: 1
          maximum: 1000
          description: Maximum number of debits permitted under this agreement.
          example: 10
        pay_id:
          type: string
          description: PayID used for payer authorization (for example email PayID or mobile PayID).
          example: sample@shabaas.com
        bsb:
          oneOf:
            - type: string
            - type: integer
          description: BSB value when bank-account based setup is used.
          example: "123456"
        account_number:
          oneOf:
            - type: string
            - type: integer
          description: Account number when bank-account based setup is used.
          example: "987654321"
        agreement_type:
          type: string
          description: Agreement variation/type code used by downstream provider where applicable.
          example: VARI
        start_date:
          type: string
          format: date
          description: Optional agreement start date in `YYYY-MM-DD`.
          example: "2026-05-01"
        end_date:
          type: string
          format: date
          description: Optional agreement end date in `YYYY-MM-DD`. Leave empty for open-ended agreement.
          example: "2026-12-31"

    ResendPaymentAgreementRequest:
      type: object
      description: Provide either agreement `id` or `phone_number`.
      oneOf:
        - required: [id]
        - required: [phone_number]
      properties:
        id:
          type: string
        phone_number:
          type: string

    BilateralAmendPaymentAgreementRequest:
      type: object
      required:
        - id
        - maximum_amount
        - frequency
        - number_of_transactions_permitted
        - agreement_type
      properties:
        id:
          type: string
        maximum_amount:
          type: string
        frequency:
          type: string
        number_of_transactions_permitted:
          oneOf:
            - type: string
            - type: integer
        agreement_type:
          type: string

    CreateOneTimePaymentAgreementRequest:
      type: object
      description: Request payload used to create a one-time payment agreement flow.
      required: [name, amount]
      properties:
        phone_number:
          type: string
          description: Optional payer mobile number used to look up or create a payer profile.
          example: "+61422020901"
        email:
          type: string
          format: email
          description: Optional payer email for communication and agreement context.
          example: payer@example.com
        name:
          type: string
          minLength: 2
          maxLength: 140
          description: Payer display name shown in agreement flow.
          example: John Smith
        amount:
          oneOf:
            - type: string
            - type: number
          description: One-time debit amount for this agreement flow.
          example: "100.00"
        notes:
          type: string
          maxLength: 140
          description: Optional short note/description attached to the one-time flow.
          example: Invoice 1042
        bsb:
          oneOf:
            - type: string
            - type: integer
          description: Optional BSB when account-based payer details are used.
          example: "123456"
        account_number:
          oneOf:
            - type: string
            - type: integer
          description: Optional account number when account-based payer details are used.
          example: "987654321"
        type:
          type: string
          description: Identifier type hint for payer details.
          enum: [email, phone, bsb]
          example: email
        pay_id:
          type: string
          description: Optional PayID value for payer authorization context.
          example: sample@shabaas.com
        frequency:
          type: string
          description: Optional frequency hint when converted into a recurring-compatible structure.
          enum: [ADHO, DAIL, FRTN, INDA, MIAN, MNTH, QURT, WEEK, YEAR, DAILY, ADHOC]
          example: ADHO
        number_of_transactions_permitted:
          oneOf:
            - type: string
            - type: integer
          description: Optional transaction count limit metadata for downstream processing.
          example: 1
        agreement_type:
          type: string
          description: Optional agreement type code used by downstream provider.
          example: VARI
        start_date:
          type: string
          format: date
          description: Optional agreement start date in `YYYY-MM-DD`.
          example: "2026-05-01"
        end_date:
          type: string
          format: date
          description: Optional agreement end date in `YYYY-MM-DD`.
          example: "2026-05-31"

    GenerateInvoiceRequest:
      type: object
      required: [amount]
      properties:
        amount:
          oneOf:
            - type: string
            - type: number
        description:
          type: string
        bill_to:
          type: string
        address:
          type: string
        receiver_abn:
          type: string
        ref_no:
          type: string
        gst_included:
          type: boolean
        gst_does_not_apply:
          type: boolean
        email:
          type: string
          format: email

    DestinationAccount:
      type: object
      description: Destination payout account details used when instant payout is enabled.
      properties:
        bsb:
          type: string
          minLength: 6
          maxLength: 6
          description: Destination BSB (6 digits).
          example: "123456"
        account_number:
          type: string
          minLength: 4
          maxLength: 12
          description: Destination account number.
          example: "12345678"

    PaymentInitiation:
      type: object
      description: Payment initiation object returned by create/get initiation APIs.
      properties:
        payment_initiation_id:
          type: string
          description: Unique payment initiation identifier.
          example: "12345PI1714316400"
        payment_agreement_id:
          type: string
          description: Linked payment agreement identifier.
          example: "3652PA20260428120000123"
        amount:
          oneOf:
            - type: string
            - type: number
          description: Debit amount for this initiation.
          example: "10.00"
        status:
          type: string
          description: Current initiation processing status.
          example: accp
        created_at:
          type: string
          format: date-time
          description: Initiation creation timestamp in ISO8601 format.
          example: "2026-04-28T13:45:00.000Z"
        settled:
          type: boolean
          description: Indicates whether the initiation has settled.
          example: false
        transfer:
          type: string
          description: Transfer state/classification when available.
          nullable: true
          example: null
        failure_code:
          type: string
          description: Provider/business failure code.
          example: R803
        message:
          type: string
          description: Failure or status message supplied by processing system.
          example: Similar payment attempted within last 24 hours

    SuccessPaymentInitiationResponse:
      type: object
      description: Standard success envelope for payment initiation APIs.
      properties:
        message:
          type: string
          description: Human-readable outcome message.
          example: Success
        data:
          $ref: '#/components/schemas/PaymentInitiation'

    CreatePaymentInitiationRequest:
      type: object
      description: Request payload used to initiate a payment against an active agreement.
      required: [payment_agreement_id, amount]
      properties:
        payment_agreement_id:
          type: string
          description: Existing active payment agreement identifier.
          example: "3652PA20260428120000123"
        amount:
          oneOf:
            - type: number
            - type: string
          description: Debit amount to initiate for this request.
          example: "10.00"
        notes:
          type: string
          maxLength: 140
          description: Optional note attached to the initiation.
          example: Invoice 1042
        description:
          type: string
          description: Ignored by the API; use `notes` for optional text.
          example: (ignored)

    DirectDebitInitiationRequest:
      type: object
      description: Request payload used to create and initiate direct debit flow.
      required: [name, phone_number, bsb, amount, consent_received]
      properties:
        id:
          type: string
          description: Optional internal reference id.
          example: "DD-REF-1001"
        phone_number:
          type: string
          description: Payer mobile number.
          example: "+61422020901"
        name:
          type: string
          minLength: 2
          maxLength: 140
          description: Payer account holder name.
          example: John Smith
        token:
          type: string
          description: Optional token passed from prior payer flow.
          example: tok_abc123
        maximum_amount:
          oneOf:
            - type: string
            - type: number
          description: Optional max amount metadata for agreement creation stage.
          example: "100.00"
        type:
          type: string
          description: Payer identifier/account type hint.
          enum: [bsb, email, phone]
          example: bsb
        bsb:
          type: string
          minLength: 6
          maxLength: 6
          description: Payer BSB.
          example: "123456"
        account_number:
          type: string
          minLength: 4
          maxLength: 12
          description: Payer account number.
          example: "987654321"
        pay_id:
          type: string
          description: Optional payer PayID.
          example: sample@shabaas.com
        checkout_page:
          type: string
          description: Optional checkout page marker/reference.
          example: direct_debit
        notes:
          type: string
          maxLength: 140
          description: Optional note attached to the debit initiation.
          example: Membership debit
        amount:
          oneOf:
            - type: string
            - type: number
          description: Debit amount requested.
          example: "50.00"
        consent_received:
          type: string
          enum: ["true"]
          description: Must be the string value `"true"`.

    WebhookUpsertRequest:
      type: object
      required:
        - auth_key
        - payment_agreement
        - payment_initiation
        - direct_debit_accepted
        - direct_debit_rejected
      properties:
        auth_key:
          type: string
        payment_agreement:
          type: string
          format: uri
        payment_initiation:
          type: string
          format: uri
        direct_debit_accepted:
          type: string
          format: uri
        direct_debit_rejected:
          type: string
          format: uri

    WebhookConfig:
      type: object
      properties:
        payment_agreement:
          type: string
          format: uri
        payment_initiation:
          type: string
          format: uri
        direct_debit_accepted:
          type: string
          format: uri
        direct_debit_rejected:
          type: string
          format: uri

    CreatePayIdCollectionRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          format: float
        merchant_id:
          type: string
        merchant_display_name:
          type: string
        merchant_country:
          type: string
          example: AU
        merchant_category:
          type: string

    SuccessPayIdCreateResponse:
      type: object
      properties:
        message:
          type: string
          example: Payid created successfully
        data:
          type: object
          properties:
            payid:
              type: string
            amount:
              oneOf:
                - type: number
                - type: string
            status:
              type: string
              example: CREATED
            expires_at:
              type: string
              example: "2026-01-02 08:49:46"

    SuccessPayIdStatusResponse:
      type: object
      properties:
        message:
          type: string
          example: Payid status
        data:
          type: object
          properties:
            status:
              type: string
              example: PENDING
            received_at:
              type: string
              nullable: true
            expected_amount:
              type: number
            received_amount:
              type: number

    ErrorModel:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      description: Compatibility alias for the standard error envelope.

    PaymentRequestObj:
      type: object
      required: [PaymentRequest]
      properties:
        PaymentRequest:
          $ref: '#/components/schemas/CreatePayIdCollectionRequest'
      description: Compatibility wrapper for payment request payloads.

    PaymentRequestStatusObj:
      allOf:
        - $ref: '#/components/schemas/SuccessPayIdStatusResponse'
      description: Compatibility wrapper for payment request status payloads.

    PaymentAgreementObj:
      type: object
      required: [PaymentAgreement]
      properties:
        PaymentAgreement:
          $ref: '#/components/schemas/CreatePaymentAgreementRequest'
      description: Compatibility wrapper for payment agreement payloads.

    PaymentAgreementStatusObj:
      allOf:
        - $ref: '#/components/schemas/SuccessPaymentAgreementResponse'
      description: Compatibility wrapper for payment agreement status payloads.

    PaymentInitiationObj:
      type: object
      required: [PaymentInitiation]
      properties:
        PaymentInitiation:
          $ref: '#/components/schemas/CreatePaymentInitiationRequest'
      description: Compatibility wrapper for payment initiation payloads.

    PaymentInitiationStatusObj:
      allOf:
        - $ref: '#/components/schemas/SuccessPaymentInitiationResponse'
      description: Compatibility wrapper for payment initiation status payloads.
