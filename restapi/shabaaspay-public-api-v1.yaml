        | Code | Status | Reason | What to do |
        | ---- | ------ | ------ | ---------- |
        | GN-0000 | 401 | Unauthorized Access to an operation | Send valid API key in `Authorization` header |
        | GN-0000 | 404 | Payment method not found | Configure merchant payment method first. |
        | GN-0000 | 422 | Missing or invalid `pay_id` | Provide a valid `pay_id` (without `@`). |
        | GN-0000 | 422 | PayID already exists | Use a different `pay_id` value. |
      security:
