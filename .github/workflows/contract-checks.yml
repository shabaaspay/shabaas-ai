name: Client contract checks
on:
  pull_request:
  push:
    branches: [fix/payto-contract-validation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/typescript/package-lock.json
      - run: npm ci
        working-directory: tools/typescript
      - run: npm run test -w @shabaaspay/agent-toolkit
        working-directory: tools/typescript
